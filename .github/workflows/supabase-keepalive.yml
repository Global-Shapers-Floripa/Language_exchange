name: Supabase Keepalive

# Evita que o projeto Supabase (free tier) seja pausado por 7 dias de inatividade.
# Roda de forma independente do pipeline de deploy/CI existente.
on:
  schedule:
    - cron: "0 12 */3 * *" # a cada 3 dias, 12h UTC
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (SELECT leve na tabela profiles)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY não configurados."
            exit 1
          fi

          http_status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP status: $http_status"
          cat /tmp/response.json

          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            echo "✅ Ping bem-sucedido em $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          else
            echo "::error::❌ Ping falhou com status HTTP $http_status"
            exit 1
          fi
